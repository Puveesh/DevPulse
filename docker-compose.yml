version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: devpulse-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-devpulse}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_USER: ${MYSQL_USER:-devpulse_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-devpulse_secret}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - devpulse_mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  devpulse_mysqldata:
    driver: local
