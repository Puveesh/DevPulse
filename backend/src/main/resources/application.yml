server:
  port: ${PORT:${SERVER_PORT:8081}}
  address: 0.0.0.0
  servlet:
    context-path: /

spring:
  application:
    name: devpulse-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: ${DB_URL:${MYSQL_URL:jdbc:mysql://${DB_HOST:${MYSQLHOST:${MYSQLPUBLICHOST:localhost}}}:${DB_PORT:${MYSQLPORT:${MYSQLPUBLICPORT:3306}}}/${DB_NAME:${MYSQLDATABASE:devpulse}}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
    username: ${DB_USERNAME:${MYSQLUSER:root}}
    password: ${DB_PASSWORD:${MYSQLPASSWORD:root}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# Security and JWT configurations
app:
  jwt:
    # 256-bit+ secure base64 or plaintext secret key (overridden in production via JWT_SECRET env var)
    secret: ${JWT_SECRET:dGVzdC1zZWNyZXQta2V5LWRldnB1bHNlLWF1dGgtMjU2LWJpdC1zZWN1cmUta2V5LWZvci10ZXN0aW5nLXB1cnBvc2VzLW9ubHk=}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
    cookie-name: devpulse_token
    cookie-secure: ${JWT_COOKIE_SECURE:false}
    cookie-same-site: Lax
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,app://devpulse}}

# OpenAPI & Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
