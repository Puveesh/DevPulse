# Production Profile (Railway / Cloud Deployment)
server:
  port: ${PORT:8080}
  address: 0.0.0.0

spring:
  datasource:
    # Supports explicit DB_* variables or Railway auto-provisioned MYSQL* variables
    url: ${DB_URL:${MYSQL_URL:jdbc:mysql://${DB_HOST:${MYSQLHOST:${MYSQLPUBLICHOST:localhost}}}:${DB_PORT:${MYSQLPORT:${MYSQLPUBLICPORT:3306}}}/${DB_NAME:${MYSQLDATABASE:devpulse}}?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}}
    username: ${DB_USERNAME:${MYSQLUSER:root}}
    password: ${DB_PASSWORD:${MYSQLPASSWORD:root}}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000
      pool-name: DevPulseHikariPool

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  jwt:
    # In production, JWT_SECRET should be supplied via environment variable
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
    cookie-name: devpulse_token
    cookie-secure: ${JWT_COOKIE_SECURE:true}
    cookie-same-site: ${JWT_COOKIE_SAME_SITE:None}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,app://devpulse}}

logging:
  level:
    root: INFO
    com.devpulse: INFO
    org.springframework.web: WARN
    org.hibernate: WARN
